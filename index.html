.form textarea{width:100%;margin-top:8px;padding:14px;background:transparent;border:1px solid #998e85;color:var(--espresso)}.wide{grid-column:1/-1}.form textarea{min-height:150px}.footergrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px}footer a{display:block;margin:12px 0}footer .serif{font-size:44px}#mobileToggle{display:none}.hidden{display:none!important}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:20px}.gallery img{width:100%;height:400px;object-fit:cover}.stickybook{position:fixed;right:22px;bottom:22px;z-index:15}.notice{font-size:12px;opacity:.8}@media(max-width:800px){header{padding:18px 24px}#mobileToggle{display:block;background:none;border:0;color:inherit;font-size:28px}nav{display:none;position:absolute;top:70px;left:0;right:0;background:var(--cream);color:var(--espresso);padding:35px 24px;flex-direction:column;align-items:flex-start}header.menuopen nav{display:flex}.grid,.gallery,.form,.footergrid{grid-template-columns:1fr}.values,.owners{grid-template-columns:repeat(2,1fr)}.wrap{padding:85px 24px}.property{min-height:410px}.pagehero{padding:140px 24px 60px}}@media(max-width:480px){.values,.owners{grid-template-columns:1fr}.hero{min-height:520px}.property h3{font-size:38px}}</style></head><body><header id="header"><a href="#/" class="brand">ARTE<small>HOSPITALITY</small></a><button id="mobileToggle" aria-label="Toggle navigation">☰</button><nav><a href="#/about">About</a><a href="#/entities">Entities</a><a href="#/owners">Owners</a><a href="#/events">Events</a><a href="#/contact">Contact</a><a class="btn" href="#/entities">Reserve</a></nav></header><main id="app"></main><footer class="dark wrap"><div class="footergrid"><div><div class="eyebrow">ARTE HOSPITALITY</div><div class="serif">Every moment,<br><em>effortlessly yours.</em></div></div><div><div class="eyebrow">Explore</div><a href="#/about">About</a><a href="#/entities">Entities</a><a href="#/owners">Owners</a><a href="#/events">Events</a><a href="#/contact">Contact</a></div><div><div class="eyebrow">Find us</div><p>640 Ocean Drive<br>Miami Beach, Florida 33139</p><a href="mailto:contact@artehospitality.com">contact@artehospitality.com</a><a href="tel:+13056852000">+1 305-685-2000</a></div></div><p style="margin-top:90px;font-size:11px">© Arte Hospitality</p></footer><script>
const properties=[
{slug:'park-central-south-beach',name:'Park Central South Beach',type:'Hotels',img:'photo-1566073771259-6a8506099945',desc:'An Ocean Drive landmark with a fresh perspective.'},
{slug:'bentley-south-beach',name:'Bentley South Beach',type:'Hotels',img:'photo-1542314831-068cd1dbfeeb',desc:'A welcoming retreat steps from the beach.'},
{slug:'thats-amore',name:"That's Amore",type:'Restaurants',img:'photo-1517248135467-4c7edcad34c4',desc:'A table made for sharing.'},
{slug:'meet-dalia',name:'Meet Dalia',type:'Restaurants',img:'photo-1414235077428-338989a2e8c0',desc:'Good company and a thoughtful plate.'},
{slug:'american-bistro',name:'American Bistro',type:'Restaurants',img:'photo-1552566626-52f8b828add9',desc:'Familiar favorites, prepared with care.'},
{slug:'casa-petra',name:'Casa Petra',type:'Restaurants',img:'photo-1514933651103-005eec06c04b',desc:'A warm welcome, from the first course.'},
{slug:'alma-cubana',name:'Alma Cubana',type:'Restaurants',img:'photo-1559339352-11d035aa65de',desc:'A lively gathering place on Ocean Drive.'},
{slug:'breakwater',name:'Breakwater',type:'Restaurants',img:'photo-1515003197210-e0cd71810b5f',desc:'A place to stay a little longer.'}
];
// Replace the null values with verified official booking URLs before launch.
const bookingUrls=Object.fromEntries(properties.map(p=>[p.slug,null]));
const image=(p,w=1000)=>'https://images.unsplash.com/'+p.img+'?w='+w+'&auto=format&fit=crop';
const card=p=>'<article class="property"><img loading="lazy" alt="Editorial placeholder for '+p.name+'" src="'+image(p)+'"><div class="info"><div class="eyebrow">'+p.type+'</div><h3>'+p.name+'</h3><p>'+p.desc+'</p><div class="actions"><a href="#/entities/'+p.slug+'">Discover</a><a href="#/entities/'+p.slug+'">Reserve information</a></div></div></article>';
const intro='<p class="eyebrow">Ocean Drive · Miami Beach</p><h2>Places to gather.<br>Moments to remember.</h2><p>Arte Hospitality brings together hotels and restaurants on Ocean Drive where people gather, connect, and feel welcome.</p>';
const values=[['Excellence in every detail','A high standard in food, service and spaces; never settle for good enough.'],['Genuine warmth','Hospitality that feels human and relaxed, never stiff or pretentious.'],['Intention behind everything','Every choice, from a playlist to a plate, is made on purpose.'],['Rooted in Ocean Drive','Every concept reflects its street, its culture and its people.']];
const vals='<div class="values">'+values.map((v,i)=>'<div><div class="eyebrow">0'+(i+1)+'</div><h3>'+v[0]+'</h3><p>'+v[1]+'</p></div>').join('')+'</div>';
const home=()=>'<section class="hero"><div><p class="eyebrow">Arte Hospitality · Miami Beach</p><h1 class="slogan">Every moment,<br>effortlessly yours.</h1><a class="btn" href="#/entities">Explore our places</a></div></section><section class="wrap intro">'+intro+'</section><section class="wrap"><p class="eyebrow">Our collection</p><h2>Distinct places.<br>One shared spirit.</h2><div class="grid">'+properties.map(card).join('')+'</div></section><section class="wrap dark">'+vals+'</section><section class="wrap center"><p class="eyebrow">Gather with us</p><h2>Make room for<br>the moment.</h2><p>From an intimate dinner to a full buyout.</p><a class="btn" href="#/events">Plan your event</a></section><section class="wrap center"><h2 class="slogan">Every moment, effortlessly yours.</h2></section>';
const story="Arte Hospitality brings together hotels and restaurants on Ocean Drive where people gather, connect, and feel welcome. From The Park Central and the Bentley Hotel South Beach to Casa Petra, Dalia, That's Amore, and American Bistro, each has its own character and shares one purpose: experiences that are deeply felt and warmly remembered. Hospitality lives in the details: a genuine welcome, music that sets the mood, a thoughtfully prepared plate. Our teams bring intention and care to every moment, delivering excellence that feels effortless so guests can relax and enjoy. As we grow, our ambition is to define hospitality on Ocean Drive, preserving each place's character and creating connections that last beyond the visit.";
const about=()=>'<section class="pagehero"><p class="eyebrow">Our story</p><h1>About Arte</h1></section><section class="wrap intro"><p>'+story+'</p></section><section class="wrap dark"><p class="eyebrow">Our mission</p><h2>To create hotels and restaurants on Ocean Drive where people gather and connect.</h2><p>Every detail is done with intention, and every guest is received with genuine warmth, so each experience is truly felt and remembered long after.</p></section><section class="wrap"><p class="eyebrow">Our vision</p><h2>To be the hospitality group that defines Ocean Drive.</h2><p>Hotels and restaurants that each have their own character and share one purpose: experiences guests feel in every way, delivered with excellence that feels effortless.</p></section><section class="wrap dark">'+vals+'</section><section class="wrap intro"><p class="eyebrow">Our promise</p><h2>Every moment, effortlessly yours.</h2><p>We anticipate needs, remove friction, and keep the atmosphere relaxed, so guests leave feeling the experience was worth it and carry it with them.</p></section>';
const entities=()=>'<section class="pagehero"><p class="eyebrow">Our places</p><h1>The collection</h1></section><section class="wrap" style="padding-top:0"><div class="filter"><button class="active" data-filter="All">All</button><button data-filter="Hotels">Hotels</button><button data-filter="Restaurants">Restaurants</button></div><div id="propertygrid" class="grid">'+properties.map(card).join('')+'</div></section>';
const names=['Shadi Shomar','Renata Giovannini','Nasser Soufia','Hani Zaki','Derya Didem Kundakci','Sena Caliskan'];
const owners=()=>'<section class="pagehero"><p class="eyebrow">Our people</p><h1>Owners</h1><p>The people behind Arte. Locals, operators, and creatives who share one standard.</p></section><section class="wrap" style="padding-top:0"><div class="owners">'+names.map((n,i)=>'<button class="owner" data-owner="'+i+'"><div class="portrait" aria-label="Portrait placeholder">'+n.charAt(0)+'</div><h3>'+n+'</h3><div class="eyebrow">Owner</div></button>').join('')+'</div><p id="ownerbio" role="status"></p></section>';
const fields=(event)=>event?'<label>Property<select name="property" required>'+properties.map(p=>'<option value="'+p.name+'">'+p.name+'</option>').join('')+'<option>Not sure yet / multiple venues</option></select></label><label>Event type<select name="eventType" required>'+['Wedding','Corporate','Private dining','Celebration','Buyout','Other'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Preferred date<input name="date" type="date" required></label><label>Alternative date<input name="alternativeDate" type="date"></label><label>Number of guests<input name="guests" type="number" min="1" required></label><label>Budget range (optional)<input name="budget"></label>':'<label>Subject<input name="subject" required></label>';
const form=event=>'<form class="form" id="inquiry"><input type="hidden" name="kind" value="'+(event?'Event proposal':'Contact')+'">'+fields(event)+'<label>Full name<input name="name" required></label>'+(event?'<label>Company (optional)<input name="company"></label>':'')+'<label>Email<input name="email" type="email" required></label>'+(event?'<label>Phone<input name="phone" type="tel" required></label>':'')+'<label class="wide">Message<textarea name="message" required></textarea></label><label class="wide"><input style="width:auto" type="checkbox" required> I agree to be contacted about my inquiry.</label><div class="wide"><button class="btn" type="submit">Prepare inquiry email</button><p class="notice">This form opens your email application. Database submission and automatic notifications are not yet connected.</p></div></form>';
const events=()=>'<section class="pagehero"><p class="eyebrow">Events</p><h1>Gather beautifully.</h1><p>From an intimate dinner to a full buyout, tell us what you have in mind and we’ll shape it around you.</p></section><section class="wrap" style="padding-top:0">'+form(true)+'</section>';
const contact=()=>'<section class="pagehero"><p class="eyebrow">Get in touch</p><h1>Contact us</h1></section><section class="wrap" style="padding-top:0"><div class="grid"><div><h2>We’re here.</h2><p>640 Ocean Drive<br>Miami Beach, Florida 33139</p><p><a href="mailto:contact@artehospitality.com">contact@artehospitality.com</a><br><a href="tel:+13056852000">+1 305-685-2000</a></p><p>Office hours: Please contact us for current availability.</p></div><div>'+form(false)+'</div></div></section><iframe title="Map of Arte Hospitality" width="100%" height="460" loading="lazy" style="border:0" src="https://www.google.com/maps?q=640+Ocean+Drive+Miami+Beach&output=embed"></iframe>';
const detail=p=>'<section class="hero" style="height:80svh;background-image:linear-gradient(#0003,#0006),url('+image(p,1800)+')"><div><p class="eyebrow">'+p.type+'</p><h1>'+p.name+'</h1></div></section><section class="wrap intro"><p class="eyebrow">Ocean Drive, Miami Beach</p><h2>'+p.desc+'</h2><p>Discover the character of '+p.name+'. More details and official photography are coming soon.</p><a class="btn" href="#/events?property='+encodeURIComponent(p.slug)+'">Plan an event here</a></section><section class="wrap"><div class="gallery"><img alt="Editorial hospitality placeholder" src="'+image(p,1200)+'"><img alt="Miami Beach editorial placeholder" src="https://images.unsplash.com/photo-1535498730771-e735b998cd64?w=1200&auto=format&fit=crop"></div><h2>Visit us</h2><p>Ocean Drive, Miami Beach, Florida</p><p>Property-specific hours, phone number, official website and booking link pending verification.</p><iframe title="Miami Beach map" loading="lazy" width="100%" height="360" style="border:0" src="https://www.google.com/maps?q=Ocean+Drive+Miami+Beach&output=embed"></iframe></section><a class="btn stickybook" href="'+(bookingUrls[p.slug]||'#/contact')+'" '+(bookingUrls[p.slug]?'target="_blank" rel="noopener noreferrer"':'')+'>'+(bookingUrls[p.slug]?'Reserve now':'Ask about reservations')+'</a>';
function render(){let path=location.hash.slice(1)||'/';let [pathname,query]=path.split('?');let slug=pathname.split('/')[2];let p=properties.find(x=>x.slug===slug);let routes={'/':home,'/about':about,'/entities':entities,'/owners':owners,'/events':events,'/contact':contact};document.getElementById('app').innerHTML=p?detail(p):(routes[pathname]||home)();document.title=(p?p.name:pathname==='/'?'Home':pathname.slice(1))+' | Arte Hospitality';document.querySelector('header').classList.remove('menuopen');window.scrollTo(0,0);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('propertygrid').innerHTML=properties.filter(x=>b.dataset.filter==='All'||x.type===b.dataset.filter).map(card).join('')}));document.querySelectorAll('[data-owner]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('ownerbio').textContent=names[Number(b.dataset.owner)]+' — Biography to be added.'}));let f=document.getElementById('inquiry');if(f){if(query){let q=new URLSearchParams(query);let selected=properties.find(x=>x.slug===q.get('property'));if(selected&&f.elements.property)f.elements.property.value=selected.name}f.addEventListener('submit',e=>{e.preventDefault();if(!f.reportValidity())return;let data=new FormData(f);let body=[...data.entries()].map(([k,v])=>k+': '+v).join('\n');location.href='mailto:contact@artehospitality.com?subject='+encodeURIComponent(data.get('kind')+' — '+data.get('name'))+'&body='+encodeURIComponent(body)})}}
window.addEventListener('hashchange',render);window.addEventListener('scroll',()=>document.getElementById('header').classList.toggle('scrolled',scrollY>40));document.getElementById('mobileToggle').addEventListener('click',()=>document.getElementById('header').classList.toggle('menuopen'));render();
</script></body></html>
